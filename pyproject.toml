[project]
name = "root"
version = "0.0.0"
readme = "README.md"
requires-python = ">=3.9"


[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/*"]

[dependency-groups]
dev = [
    "ipykernel>=6.29.5",
    "pytest-cov>=5.0.0",
    "pytest>=8.3.2",
    "docstr-coverage>=2.3.2",
    "oudia",
    "gtfs2oudia",
]

[tool.uv.sources]
oudia = { workspace = true }
gtfs2oudia = { workspace = true }

[tool.black]
target-version = ["py312"]
line-length = 120
